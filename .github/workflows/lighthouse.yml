name: lighthouse

on:
  pull_request:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jakartabc
          POSTGRES_PASSWORD: jakartabc
          POSTGRES_DB: jakartabc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jakartabc -d jakartabc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://jakartabc:jakartabc@localhost:5432/jakartabc
      PAYLOAD_SECRET: ci-secret-32-chars-minimum-padding-xx
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DEFAULT_LOCALE: en

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @jakartabc/web build

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Run Lighthouse budgets
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: pnpm dlx @lhci/cli@0.14.0 autorun --config=apps/web/lighthouserc.json
