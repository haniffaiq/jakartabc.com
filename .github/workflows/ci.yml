name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jakartabc
          POSTGRES_PASSWORD: jakartabc
          POSTGRES_DB: jakartabc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jakartabc -d jakartabc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://jakartabc:jakartabc@localhost:5432/jakartabc
      PAYLOAD_SECRET: ci-build-only-payload-secret-not-runtime
      REDIS_URL: redis://localhost:6379
      REDIS_KEY_PREFIX: jakartabc:ci
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_REGION: us-east-1
      MINIO_BUCKET: jakartabc-ci
      MINIO_ACCESS_KEY: ci-build-only-minio-access
      MINIO_SECRET_KEY: ci-build-only-minio-secret
      MINIO_PUBLIC_URL: http://localhost:9000/jakartabc-ci
      MINIO_FORCE_PATH_STYLE: 'true'
      TRUSTED_PROXY_SECRET: ci-build-only-proxy-secret-not-runtime
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DEFAULT_LOCALE: en
      REVALIDATE_SECRET: ci-build-only-revalidation-secret
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: ci-build-only-resend-key
      EMAIL_FROM: ci@example.invalid
      SALES_EMAIL: ci@example.invalid
      TURNSTILE_SECRET_KEY: ci-build-only-turnstile-secret
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-build-only-turnstile-site-key
      PORTAL_COOKIE_DOMAIN: localhost
      NEXT_PUBLIC_PORTAL_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - name: Detect pnpm workspace
        id: workspace
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml && -f package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Note skipped scaffold verification
        if: steps.workspace.outputs.present != 'true'
        shell: bash
        run: |
          echo "No pnpm workspace files found on this ref yet; skipping lint/typecheck/test/build."
          echo "When Phase 0 scaffold lands with package.json and pnpm-lock.yaml, this workflow will run full verification."

      - uses: actions/setup-node@v4
        if: steps.workspace.outputs.present == 'true'
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        if: steps.workspace.outputs.present == 'true'
        with:
          version: 9.12.3
          run_install: false

      - name: pnpm store path
        if: steps.workspace.outputs.present == 'true'
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: steps.workspace.outputs.present == 'true'
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        if: steps.workspace.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Production audit policy tests
        if: steps.workspace.outputs.present == 'true'
        run: node --test scripts/production-audit-policy.test.mjs

      - name: Production audit gate
        if: steps.workspace.outputs.present == 'true'
        run: pnpm audit:prod

      - name: Lint
        if: steps.workspace.outputs.present == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.workspace.outputs.present == 'true'
        run: pnpm typecheck

      - name: Unit tests (workspace, includes portal)
        if: steps.workspace.outputs.present == 'true'
        run: pnpm test

      - name: Build portal app
        if: steps.workspace.outputs.present == 'true'
        run: pnpm --filter @jakartabc/portal build

      - name: Build web app
        if: steps.workspace.outputs.present == 'true'
        run: pnpm --filter @jakartabc/web build
