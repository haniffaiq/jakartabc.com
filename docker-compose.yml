name: jakartabc

# App-only stack: web (FE) + portal (BE) + web-migrate (init container).
# Postgres, Redis and MinIO are shared/external services. Locally they come
# from the `infa-basic` project, which owns the `shared-infra` network; the
# app containers join it and address them by service name (postgres, redis,
# minio). On a server, point the URLs at whatever hosts them instead.
# TLS termination is done by a native nginx on the server host, not here.

services:
  # Init container: applies committed Payload migrations against $DATABASE_URL.
  # Runs once per `docker compose up`; web/portal wait for it to exit 0.
  # DATABASE_URL points at the shared Postgres.
  web-migrate:
    image: jakartabc-web-builder
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    env_file: .env
    environment:
      NODE_ENV: production
    command: pnpm --filter @jakartabc/web exec payload migrate
    working_dir: /repo
    networks:
      - shared-infra
    restart: 'no'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    env_file: .env
    restart: unless-stopped
    depends_on:
      web-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
    volumes:
      - uploads:/app/apps/web/uploads
    networks:
      - shared-infra
    expose:
      - '3000'
    ports:
      - '3100:3000'

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL}
    env_file: .env
    restart: unless-stopped
    depends_on:
      web-migrate:
        condition: service_completed_successfully
    networks:
      - shared-infra
    expose:
      - '3001'
    ports:
      - '3101:3001'

volumes:
  uploads:

networks:
  # Owned by the `infa-basic` compose project (postgres, redis, minio).
  shared-infra:
    external: true
