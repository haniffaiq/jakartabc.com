name: jakartabc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jakartabc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jakartabc}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jakartabc} -d ${POSTGRES_DB:-jakartabc}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        DATABASE_URL: ${BUILD_DATABASE_URL:-${DATABASE_URL}}
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
        REVALIDATE_SECRET: ${REVALIDATE_SECRET}
        EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
        RESEND_API_KEY: ${RESEND_API_KEY}
        EMAIL_FROM: ${EMAIL_FROM}
        SALES_EMAIL: ${SALES_EMAIL}
        TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
    volumes:
      - uploads:/app/apps/web/uploads
    networks:
      - internal
    expose:
      - '3000'
    ports:
      - '3100:3000'

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        DATABASE_URL: ${BUILD_DATABASE_URL:-${DATABASE_URL}}
        PORTAL_PAYLOAD_SECRET: ${PORTAL_PAYLOAD_SECRET}
        PORTAL_COOKIE_DOMAIN: ${PORTAL_COOKIE_DOMAIN:-app.jakartabc.com}
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL}
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORTAL_PAYLOAD_SECRET: ${PORTAL_PAYLOAD_SECRET}
      PORTAL_COOKIE_DOMAIN: ${PORTAL_COOKIE_DOMAIN}
      NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL}
    networks:
      - internal
    expose:
      - '3001'
    ports:
      - '3101:3001'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '8080:80'
      - '8443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-staging.jakartabc.com}
      ACME_EMAIL: ${ACME_EMAIL}
    networks:
      - internal

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
