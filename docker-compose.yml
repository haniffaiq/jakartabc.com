name: jakartabc

# App-only stack: web (FE) + portal (BE) + web-migrate (init container).
# Postgres runs as a shared/external instance — set DATABASE_URL accordingly.
# TLS termination is done by a native nginx on the server host, not here.

services:
  # Init container: applies committed Payload migrations against $DATABASE_URL.
  # Runs once per `docker compose up`; web/portal wait for it to exit 0.
  # DATABASE_URL points at the shared Postgres (host.docker.internal for a DB
  # on the server host, or a managed-DB connection string).
  web-migrate:
    image: jakartabc-web-builder
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    env_file: .env
    environment:
      NODE_ENV: production
    command: pnpm --filter @jakartabc/web exec payload migrate
    working_dir: /repo
    networks:
      - internal
    # Reach a Postgres running on the server host (DATABASE_URL points at
    # host.docker.internal). `host-gateway` makes that name resolve on Linux.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: 'no'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    env_file: .env
    restart: unless-stopped
    depends_on:
      web-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
    volumes:
      - uploads:/app/apps/web/uploads
    networks:
      - internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    expose:
      - '3000'
    ports:
      - '3100:3000'

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL}
    env_file: .env
    restart: unless-stopped
    depends_on:
      web-migrate:
        condition: service_completed_successfully
    networks:
      - internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    expose:
      - '3001'
    ports:
      - '3101:3001'

volumes:
  uploads:

networks:
  internal:
    driver: bridge
